# Paper storefront marketing copy — Saleor Configurator 3.23+
#
# Deploy:
#   pnpm configurator:storefront-content:plan
#   pnpm configurator:storefront-content:deploy
#
# Requires SALEOR_APP_TOKEN with MANAGE_PAGES + MANAGE_PAGE_TYPES_AND_ATTRIBUTES (or admin).
# CONTENT_PROVIDER defaults to saleor; set CONTENT_PROVIDER=code to use code defaults only.
#
# Page slug convention (globally unique in Saleor):
#   storefront-chrome, storefront-homepage, storefront-cart, storefront-checkout
#   Channel override: storefront-chrome-{channelSlug}
#
# Attribute slugs must match src/lib/content/attribute-slugs.ts
# Greenfield: pnpm configurator:storefront-content:deploy — creates PageTypes, attributes, and seed models below.
#
# Scope (ADR 0002): this layer holds *editorial / merchant-editable* copy only. Functional
# UI strings (cart totals/buttons/a11y labels, item count, cart-page chrome, breadcrumbs)
# are code-owned via next-intl (messages/*.json) and intentionally NOT modeled here.

contentAttributes:
  # Storefront — Policies (channel-wide facts; NUMERIC so the Dashboard validates them
  # and the storefront can reuse the same value in cart math and in copy placeholders)
  - name: Free shipping threshold
    inputType: NUMERIC
  - name: Returns window days
    inputType: NUMERIC
  # Storefront — Chrome
  - name: Announcement ID
    inputType: PLAIN_TEXT
  # Seed + translations: keep {freeShippingThreshold} (value from storefront-policy model)
  - name: Announcement message
    inputType: PLAIN_TEXT
  - name: Announcement href
    inputType: PLAIN_TEXT
  - name: Announcement link label
    inputType: PLAIN_TEXT
  - name: Announcement dismissible
    inputType: BOOLEAN
  - name: Nav all products label
    inputType: PLAIN_TEXT
  - name: Nav view all label
    inputType: PLAIN_TEXT
  # Storefront — Products listing
  - name: Listing title
    inputType: PLAIN_TEXT
  - name: Listing description
    inputType: PLAIN_TEXT
  # Storefront — Homepage
  - name: Hero eyebrow
    inputType: PLAIN_TEXT
  - name: Hero heading
    inputType: PLAIN_TEXT
  - name: Hero subheading
    inputType: PLAIN_TEXT
  - name: Hero CTA label
    inputType: PLAIN_TEXT
  - name: Hero image
    inputType: FILE
  - name: Featured heading
    inputType: PLAIN_TEXT
  - name: Featured collection
    inputType: SINGLE_REFERENCE
    entityType: COLLECTION
  - name: Featured limit
    inputType: NUMERIC
  - name: Categories heading
    inputType: PLAIN_TEXT
  - name: Categories eyebrow
    inputType: PLAIN_TEXT
  - name: Brand story heading
    inputType: PLAIN_TEXT
  - name: Brand story paragraph 1
    inputType: PLAIN_TEXT
  - name: Brand story paragraph 2
    inputType: PLAIN_TEXT
  - name: Values heading
    inputType: PLAIN_TEXT
  - name: Values columns desktop
    inputType: PLAIN_TEXT
  - name: Values column 1 title
    inputType: PLAIN_TEXT
  - name: Values column 1 text
    inputType: PLAIN_TEXT
  - name: Values column 2 title
    inputType: PLAIN_TEXT
  # Seed + translations: keep {returnsWindowDays} (value from storefront-policy model)
  - name: Values column 2 text
    inputType: PLAIN_TEXT
  - name: Values column 3 title
    inputType: PLAIN_TEXT
  - name: Values column 3 text
    inputType: PLAIN_TEXT
  - name: Editorial heading
    inputType: PLAIN_TEXT
  - name: Editorial paragraph 1
    inputType: PLAIN_TEXT
  - name: Editorial image position
    inputType: PLAIN_TEXT
  - name: Editorial CTA label
    inputType: PLAIN_TEXT
  - name: Photo credits
    inputType: PLAIN_TEXT
    # JSON array: [{"name":"Artist","href":"https://unsplash.com/@handle"}, ...]
  # Storefront — Cart
  - name: Empty title
    inputType: PLAIN_TEXT
  - name: Empty body
    inputType: PLAIN_TEXT
  - name: Empty CTA label
    inputType: PLAIN_TEXT
  - name: Trust free shipping prefix
    inputType: PLAIN_TEXT
  # Seed + translations: keep {returnsWindowDays}
  - name: Trust returns label
    inputType: PLAIN_TEXT
  - name: Drawer title
    inputType: PLAIN_TEXT
  - name: Drawer add for free shipping
    inputType: PLAIN_TEXT
  - name: Drawer free shipping qualified
    inputType: PLAIN_TEXT
  # Storefront — Checkout
  - name: Empty cart title
    inputType: PLAIN_TEXT
  - name: Empty cart body
    inputType: PLAIN_TEXT
  - name: Empty cart start label
    inputType: PLAIN_TEXT
  - name: Empty cart go back label
    inputType: PLAIN_TEXT
  - name: Empty session title
    inputType: PLAIN_TEXT
  - name: Empty session message
    inputType: PLAIN_TEXT
  - name: Marketing opt-in label
    inputType: PLAIN_TEXT
  - name: Trust secure checkout
    inputType: PLAIN_TEXT
  - name: Trust Stripe processor
    inputType: PLAIN_TEXT

modelTypes:
  - name: "Storefront — Policies"
    slug: storefront-policies
